<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل الحلقة | سعودي بلاي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060d16;
            --line: rgba(255, 255, 255, 0.07);
            --tx: #eef0f6;
            --mut: #8f95a8;
            --saudi: #1ba94c;
            --saudi-dark: #0e7a36;
            --gold: #e7c069;
            --grad: linear-gradient(135deg, #0e7a36 0%, #1ba94c 38%, #00a3b8 72%, #e7c069 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg); color: var(--tx); min-height: 100vh;
            font-weight: 500;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        ::selection { background: rgba(27, 169, 76, .35); }
        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--saudi), var(--gold)); border-radius: 8px; }

        .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .aurora::before { content: ''; position: absolute; width: 560px; height: 560px; border-radius: 50%; filter: blur(100px); background: rgba(0, 163, 184, .26); top: -180px; right: -140px; }
        .aurora::after { content: ''; position: absolute; width: 460px; height: 460px; border-radius: 50%; filter: blur(110px); background: rgba(139, 195, 74, .18); bottom: -200px; left: -120px; }
        .sunburst { position: fixed; top: 50%; left: 50%; width: 150vmax; height: 150vmax; z-index: 0; pointer-events: none; opacity: .05;
            background: repeating-conic-gradient(from 0deg, rgba(231, 192, 105, .9) 0deg 1.2deg, transparent 1.2deg 7deg);
            animation: spin 140s linear infinite; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .wrap { position: relative; z-index: 1; }
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 5%;
            background: rgba(7, 8, 16, .6); backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
        }
        .logo { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .logo .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 14px rgba(27, 169, 76, .8); }
        .logo .red { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .back { color: var(--mut); font-size: 14px; font-weight: 700; padding: 9px 20px; border-radius: 24px; border: 1px solid var(--line); transition: all .25s; }
        .back:hover { color: var(--gold); border-color: var(--gold); transform: translateY(-2px); }

        .player-area { padding: 24px 5% 40px; }
        .player-frame {
            position: relative; width: 100%; max-width: 960px; margin: 0 auto;
            background: #000; border-radius: 18px; overflow: hidden;
            border: 1px solid var(--line); box-shadow: 0 30px 70px rgba(0, 0, 0, .6);
        }
        .aspect { padding-top: 56.25%; }
        .player-frame iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .servers { max-width: 960px; margin: 20px auto 0; display: flex; flex-wrap: wrap; gap: 10px; }
        .server-btn {
            padding: 11px 20px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
            background: rgba(255, 255, 255, .04); color: var(--mut); border: 1px solid var(--line);
            border-radius: 26px; transition: all .25s;
        }
        .server-btn:hover { color: var(--tx); border-color: rgba(27, 169, 76, .5); transform: translateY(-2px); }
        .server-btn.active { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 8px 22px rgba(27, 169, 76, .35); }

        .note { max-width: 960px; margin: 18px auto 0; color: var(--mut); font-size: 13px; line-height: 1.9; }
        .note b { color: var(--tx); }
    </style>
</head>
<body>

    <div class="aurora"></div>
    <div class="sunburst"></div>
    <div class="wrap">
        <header>
            <a href="index.html" class="logo"><span class="dot"></span><span class="red">سعودي بلاي</span></a>
            <a href="index.html" class="back">← العودة للرئيسية</a>
        </header>

        <div class="player-area">
            <div class="player-frame">
                <div class="aspect"></div>
                <iframe id="playerFrame" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
            </div>
            <div class="servers" id="servers"></div>
            <p class="note"><b>ملاحظة:</b> إذا لم يعمل المشغل فجرّب مشغلاً آخر من القائمة أعلاه. قد يتطلب بعض المشغلين تعطيل مانع الإعلانات أو السماح بالنوافذ المنبثقة.</p>
        </div>
    </div>

    <script>
        function b64decode(str) {
            let s = str.replace(/-/g, '+').replace(/_/g, '/');
            while (s.length % 4 !== 0) s += '=';
            return decodeURIComponent(escape(atob(s)));
        }

        function embedFor(name, id) {
            switch (name) {
                case 'Arab HD': return 'https://arabhd.onl/embed-' + id + '.html';
                case 'estream': return 'https://arabveturk.com/embed-' + id + '.html';
                case 'dailymotion': return 'https://www.dailymotion.com/embed/video/' + id;
                case 'ok': return 'https://ok.ru/videoembed/' + id;
                case 'Red HD': return 'https://iplayerhls.com/e/' + id;
                case 'Pro HD': return 'https://w.larhu.website/play.php?id=' + id;
                case 'youtube': return 'https://www.youtube.com/embed/' + id;
                default: return '';
            }
        }

        const params = new URLSearchParams(window.location.search);
        const post = params.get('post') || '';
        const serversEl = document.getElementById('servers');
        const frame = document.getElementById('playerFrame');

        let servers = [];
        try {
            const data = JSON.parse(b64decode(post));
            servers = data.servers || [];
        } catch (e) {
            serversEl.innerHTML = '<p class="note">رابط المشغّل غير صالح.</p>';
        }

        function loadServer(name, id, directUrl) {
            const url = directUrl || embedFor(name, id);
            if (url) {
                frame.src = url;
                serversEl.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            }
        }

        if (servers.length === 0) {
            serversEl.innerHTML = '<p class="note">لا توجد سيرفرات تشغيل لهذه الحلقة.</p>';
        } else {
            servers.forEach((s, i) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (i === 0 ? ' active' : '');
                btn.textContent = 'مشغل ' + (i + 1) + ' - ' + s.name;
                btn.addEventListener('click', () => {
                    loadServer(s.name, s.id, s.url);
                    btn.classList.add('active');
                });
                serversEl.appendChild(btn);
            });
            loadServer(servers[0].name, servers[0].id, servers[0].url);
        }
    </script>
</body>
</html>
