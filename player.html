<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل الحلقة | سعودي بلاي</title>
    <meta name="theme-color" content="#0b0b0f">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e50914'/%3E%3Cstop offset='1' stop-color='%23b20710'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b0b0f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3Cpath d='M26 22 L46 32 L26 42 Z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0f;
            --bg-2: #101018;
            --panel: #16161f;
            --card: #1d1d28;
            --card-hover: #262633;
            --red: #e50914;
            --red-dark: #b20710;
            --red-light: #ff3b46;
            --text: #f5f5f7;
            --mut: #9a9aa8;
            --border: #26262f;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            line-height: 1.6; overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        ::selection { background: rgba(229, 9, 20, .35); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #33333f; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red); }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .navbar-inner {
            max-width: 1400px; margin: 0 auto; padding: 0 4%; height: 68px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .logo { font-size: 26px; font-weight: 800; letter-spacing: 1px; color: var(--red); white-space: nowrap; }
        .logo span { color: var(--text); }
        .back {
            color: var(--mut); font-size: 14px; font-weight: 700; padding: 9px 20px;
            border-radius: 8px; border: 1px solid var(--border); transition: all .25s;
            background: var(--card);
        }
        .back:hover { color: var(--text); border-color: var(--red); transform: translateY(-2px); }

        .player-area { max-width: 1200px; margin: 0 auto; padding: 30px 4% 50px; }
        .player-frame {
            position: relative; width: 100%; max-width: 960px; margin: 0 auto;
            background: #000; border-radius: var(--radius); overflow: hidden;
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .aspect { padding-top: 56.25%; }
        .player-frame video, .player-frame iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .player-frame video { background: #000; display: none; }
        .player-frame.video-mode video { display: block; }
        .player-frame.video-mode iframe { display: none; }
        .skip-ad {
            position: absolute; top: 10px; right: 10px; z-index: 30;
            display: none; align-items: center; gap: 6px;
            background: rgba(11, 11, 15, .78); color: #fff;
            border: 1px solid var(--red); border-radius: 8px;
            padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: 700;
            cursor: pointer; backdrop-filter: blur(4px); transition: all .2s;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
        }
        .skip-ad:hover { background: var(--red); transform: scale(1.05); }
        .skip-ad.visible { display: flex; }

        .servers { max-width: 960px; margin: 20px auto 0; display: flex; flex-wrap: wrap; gap: 10px; }
        .server-btn {
            padding: 10px 20px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
            background: var(--card); color: var(--mut); border: 1px solid var(--border);
            border-radius: 8px; transition: all .25s;
        }
        .server-btn:hover { color: var(--text); border-color: var(--red); transform: translateY(-2px); }
        .server-btn.active { background: var(--red); color: #fff; border-color: transparent; box-shadow: 0 6px 20px rgba(229, 9, 20, .35); }

        .note { max-width: 960px; margin: 18px auto 0; color: var(--mut); font-size: 13px; line-height: 1.9; }
        .note b { color: var(--text); }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="/" class="logo">سعودي<span>بلاي</span></a>
            <a href="/channels.html" class="back">&#128250; القنوات المباشرة</a>
        </div>
    </header>

    <div class="player-area">
        <div class="player-frame" id="playerFrameBox">
            <div class="aspect">
                <video id="nativePlayer" controls playsinline webkit-playsinline></video>
                <iframe id="playerFrame" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
            </div>
            <button class="skip-ad" id="skipAd" type="button">&#9197;&#65039; تخطي الإعلان</button>
        </div>
        <div class="servers" id="servers"></div>
        <div class="servers" id="tpbList"></div>
        <p class="note" id="tpbStatus"></p>
        <div class="servers" id="nfxServers"></div>
        <p class="note" id="nfxStatus"></p>
        <p class="note"><b>ملاحظة:</b> إذا لم يعمل المشغل فجرّب مشغلاً آخر من القائمة أعلاه. قد يتطلب بعض المشغلين تعطيل مانع الإعلانات أو السماح بالنوافذ المنبثقة.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script>
        function b64decode(str) {
            let s = str.replace(/-/g, '+').replace(/_/g, '/');
            while (s.length % 4 !== 0) s += '=';
            return decodeURIComponent(escape(atob(s)));
        }

        function embedFor(name, id) {
            switch (name) {
                case 'Arab HD': return 'https://arabhd.onl/embed-' + id + '.html';
                case 'estream': return 'https://arabveturk.com/embed-' + id + '.html';
                case 'dailymotion': return 'https://www.dailymotion.com/embed/video/' + id;
                case 'ok': return 'https://ok.ru/videoembed/' + id;
                case 'Red HD': return 'https://iplayerhls.com/e/' + id;
                case 'Pro HD': return 'https://w.larhu.website/play.php?id=' + id;
                case 'youtube': return 'https://www.youtube.com/embed/' + id;
                default: return '';
            }
        }

        const params = new URLSearchParams(window.location.search);
        const post = params.get('post') || '';
        const serversEl = document.getElementById('servers');
        const frame = document.getElementById('playerFrame');
        const box = document.getElementById('playerFrameBox');
        const video = document.getElementById('nativePlayer');
        const skipAd = document.getElementById('skipAd');
        let hlsInstance = null;
        let wtClient = null;
        let lastFrameUrl = '';

        function showSkip() { skipAd.classList.add('visible'); }
        function hideSkip() { skipAd.classList.remove('visible'); }

        function stopTorrent() {
            if (wtClient) { try { wtClient.destroy(); } catch (e) {} wtClient = null; }
        }

        function stopNative() {
            video.pause();
            video.removeAttribute('src');
            video.load();
            if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
            stopTorrent();
            box.classList.remove('video-mode');
        }

        function setFrame(url) {
            stopNative();
            lastFrameUrl = url;
            frame.src = url;
            showSkip();
        }

        function setNative(m3u8Url) {
            stopNative();
            box.classList.add('video-mode');
            showSkip();
            if (window.Hls && Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true });
                hlsInstance.loadSource(m3u8Url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.ERROR, function (e, data) {
                    if (data && data.fatal) hlsInstance.recoverMediaError();
                });
                video.play().catch(function () {});
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8Url;
                video.play().catch(function () {});
            } else {
                box.classList.remove('video-mode');
            }
        }

        function loadGovid(playUrl) {
            stopNative();
            fetch('/api/govid?url=' + encodeURIComponent(playUrl))
                .then(function (r) {
                    if (!r.ok) throw new Error('status ' + r.status);
                    return r.text();
                })
                .then(function (manifest) {
                    const blob = new Blob([manifest], { type: 'application/vnd.apple.mpegurl' });
                    setNative(URL.createObjectURL(blob));
                })
                .catch(function () {
                    box.classList.remove('video-mode');
                    lastFrameUrl = playUrl;
                    frame.src = playUrl;
                    showSkip();
                });
        }

        let servers = [];
        try {
            const data = JSON.parse(b64decode(post));
            servers = data.servers || [];
        } catch (e) {
            serversEl.innerHTML = '<p class="note">رابط المشغّل غير صالح.</p>';
        }

        function loadServer(name, id, directUrl) {
            const url = directUrl || embedFor(name, id);
            if (url) {
                if (url.indexOf('govid.live/play/') !== -1) {
                    loadGovid(url);
                } else {
                    setFrame(url);
                }
                serversEl.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            }
        }

        if (servers.length === 0) {
            serversEl.innerHTML = '<p class="note">لا توجد سيرفرات تشغيل لهذه الحلقة.</p>';
        } else {
            servers.forEach((s, i) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (i === 0 ? ' active' : '');
                btn.textContent = 'مشغل ' + (i + 1) + ' - ' + s.name;
                btn.addEventListener('click', () => {
                    loadServer(s.name, s.id, s.url);
                    btn.classList.add('active');
                });
                serversEl.appendChild(btn);
            });
            loadServer(servers[0].name, servers[0].id, servers[0].url);
        }

        // ---------- TPB+ تورنت ----------
        const qTitle = params.get('t') || '';
        const qType = params.get('ty') === 'movie' ? 'movie' : 'series';
        const qEp = parseInt(params.get('e') || '', 10) || 1;
        const tpbStatus = document.getElementById('tpbStatus');
        const tpbList = document.getElementById('tpbList');

        function tpbNote(msg) { tpbStatus.textContent = msg || ''; }

        function rankQuality(q) {
            const t = String(q || '').toLowerCase();
            if (/2160|4k|uhd/.test(t)) return 2160;
            const m = /(\d{3,4})p/.exec(t);
            return m ? Number(m[1]) : 0;
        }

        function parseTpbStreams(json) {
            const out = [];
            const seen = new Set();
            for (const st of (json.streams || [])) {
                const infoHash = st.infoHash || (typeof st.url === 'string' && /btih:([a-fA-F0-9]{40})/i.exec(st.url)?.[1]);
                if (!infoHash) continue;
                const fileIdx = st.fileIdx != null ? Number(st.fileIdx) : 0;
                const dk = infoHash + ':' + fileIdx;
                if (seen.has(dk)) continue;
                seen.add(dk);
                const title = st.title || st.name || 'TPB+';
                const size = (title.match(/(\d+(?:[.,]\d+)?\s*(?:GB|MB|KB))/i) || [])[1] || '';
                const seeds = (title.match(/👤\s*(\d+)/) || [])[1];
                out.push({
                    infoHash,
                    fileIdx,
                    quality: String(st.tag || '').toLowerCase() || 'auto',
                    name: title.split('\n')[0].trim(),
                    size,
                    seeders: seeds ? Number(seeds) : null
                });
            }
            out.sort(function (a, b) { return rankQuality(b.quality) - rankQuality(a.quality); });
            return out;
        }

        function openTpb() {
            if (!qTitle) { tpbNote('لا يتوفر عنوان لهذه الحلقة لإجراء بحث TPB+. أعد فتح المشغل من الصفحة الرئيسية.'); return; }
            tpbList.innerHTML = '';
            tpbNote('⏳ جارٍ البحث عن تدفقات TPB+...');
            ensureWebTorrent();
            fetch('/api/resolve?q=' + encodeURIComponent(qTitle) + '&type=' + qType)
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (!res || !res.imdbId) {
                        tpbNote('تعذّر تحويل العنوان إلى IMDb: ' + ((res && res.error) || 'لا توجد مطابقة.'));
                        return null;
                    }
                    const idPath = qType === 'series' ? res.imdbId + ':1:' + qEp : res.imdbId;
                    return fetch('https://thepiratebay-plus.strem.fun/stream/' + qType + '/' + idPath + '.json');
                })
                .then(function (r) {
                    if (!r) return null;
                    if (!r.ok) throw new Error('TPB+ HTTP ' + r.status);
                    return r.json();
                })
                .then(function (d) {
                    if (!d) return;
                    const streams = parseTpbStreams(d);
                    if (!streams.length) {
                        tpbNote('لا توجد تدفقات TPB+ متاحة لهذا المحتوى حالياً. جرب لاحقاً أو استخدم المشغلات أعلاه.');
                        return;
                    }
                    tpbNote('اختر تدفقاً: (الجودة الأعلى أولاً)');
                    streams.forEach(function (st) {
                        const btn = document.createElement('button');
                        btn.className = 'server-btn';
                        const meta = [st.quality, st.size, st.seeders != null ? '👤 ' + st.seeders : null].filter(Boolean).join(' · ');
                        btn.textContent = meta + ' — ' + st.name;
                        btn.title = st.name;
                        btn.addEventListener('click', function () {
                            tpbList.querySelectorAll('.server-btn').forEach(function (b) { b.classList.remove('active'); });
                            btn.classList.add('active');
                            playTorrent(st);
                        });
                        tpbList.appendChild(btn);
                    });
                })
                .catch(function (err) { tpbNote('خطأ في جلب التدفقات: ' + err.message); });
        }

        function ensureWebTorrent(cb) {
            if (window.WebTorrent) { if (cb) cb(); return; }
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/webtorrent@1.9.7/webtorrent.min.js';
            s.onload = function () { if (cb) cb(); };
            s.onerror = function () { tpbNote('تعذّر تحميل مكتبة WebTorrent من CDN.'); };
            document.head.appendChild(s);
        }

        function playTorrent(stream) {
            stopNative();
            box.classList.add('video-mode');
            showSkip();
            frame.removeAttribute('src');
            tpbNote('⏳ جارٍ تحميل WebTorrent والاتصال بالتورنت...');
            ensureWebTorrent(function () {
                if (!window.WebTorrent) return;
                try {
                    wtClient = new window.WebTorrent();
                } catch (e) { tpbNote('تعذّر بدء WebTorrent: ' + e.message); return; }
                const magnet = 'magnet:?xt=urn:btih:' + stream.infoHash.toLowerCase() +
                    '&dn=' + encodeURIComponent((stream.name || 'TPB+').split(/[\\/]/).pop());
                let torrent;
                try {
                    torrent = wtClient.add(magnet, onTorrentReady);
                } catch (e) { tpbNote('تعذّر بدء التورنت: ' + e.message); return; }
                torrent.on('warning', function (err) { console.warn('torrent warning', err && err.message); });
                torrent.on('error', function (err) { tpbNote('خطأ تورنت: ' + (err && err.message || err)); });
                torrent.on('download', function () {
                    if (!torrent.progress) return;
                    const pct = Math.floor(torrent.progress * 100);
                    const mb = torrent.downloadSpeed ? (torrent.downloadSpeed / 1024 / 1024).toFixed(1) : '0';
                    tpbNote('⏳ جارٍ التحميل: ' + pct + '% (' + mb + ' MB/ث)');
                });

                function onTorrentReady(t) {
                    const file = pickPlayableFile(t, stream.fileIdx);
                    if (!file) {
                        tpbNote('لا يمكن تشغيل هذا التورنت في المتصفح (صيغة غير مدعومة). جرّب تدفقاً آخر.');
                        return;
                    }
                    tpbNote('▶ جارٍ التشغيل عبر تورنت: ' + file.name);
                    try {
                        file.renderTo(video, { autoplay: true });
                    } catch (e) { tpbNote('تعذّر تشغيل الملف: ' + e.message); }
                }
            });
        }

        function pickPlayableFile(torrent, fileIdx) {
            const files = torrent.files || [];
            if (!files.length) return null;
            const playable = /\.(mp4|m4v|webm|mov|ogv|ogg)([?#]|$)/i;
            const candidate = files[fileIdx];
            if (candidate && playable.test(candidate.name || '')) return candidate;
            return files.slice().sort(function (a, b) { return b.length - a.length; }).find(function (f) { return playable.test(f.name || ''); }) || null;
        }

        const tpbBtn = document.createElement('button');
        tpbBtn.className = 'server-btn';
        tpbBtn.textContent = '⚡ TPB+ تورنت';
        tpbBtn.addEventListener('click', openTpb);
        serversEl.appendChild(tpbBtn);

        // ---------- NyumatFlix (مصادر TMDB إضافية) ----------
        const nfxServers = document.getElementById('nfxServers');
        const nfxStatus = document.getElementById('nfxStatus');
        const NFX_PROVIDERS = [
            { name: 'VidSrc', movie: id => 'https://vsembed.ru/embed/movie?tmdb=' + id, tv: (id, s, e) => 'https://vsembed.ru/embed/tv?tmdb=' + id + '&season=' + s + '&episode=' + e },
            { name: 'VidSrc Mirror', movie: id => 'https://vidsrc.wtf/embed/movie?tmdb=' + id, tv: (id, s, e) => 'https://vidsrc.wtf/embed/tv?tmdb=' + id + '&season=' + s + '&episode=' + e },
            { name: 'SuperEmbed', movie: id => 'https://multiembed.mov/?video_id=' + id + '&tmdb=1', tv: (id, s, e) => 'https://multiembed.mov/?video_id=' + id + '&tmdb=1&s=' + s + '&e=' + e },
            { name: '2Embed', movie: id => 'https://www.2embed.cc/embed/' + id, tv: (id, s, e) => 'https://www.2embed.cc/embedtv/' + id + '&s=' + s + '&e=' + e },
            { name: '111Movies', movie: id => 'https://111movies.com/movie/' + id, tv: (id, s, e) => 'https://111movies.com/tv/' + id + '/' + s + '/' + e },
            { name: 'VidNest', movie: id => 'https://vidnest.fun/movie/' + id, tv: (id, s, e) => 'https://vidnest.fun/tv/' + id + '/' + s + '/' + e },
            { name: 'VidFast', movie: id => 'https://vidfast.pro/movie/' + id + '?autoPlay=true', tv: (id, s, e) => 'https://vidfast.pro/tv/' + id + '/' + s + '/' + e + '?autoPlay=true&nextButton=true&autoNext=true' },
            { name: 'VidEasy', movie: id => 'https://player.videasy.net/movie/' + id, tv: (id, s, e) => 'https://player.videasy.net/tv/' + id + '/' + s + '/' + e },
            { name: 'VidKing', movie: id => 'https://www.vidking.net/embed/movie/' + id + '?color=9146ff&autoPlay=true', tv: (id, s, e) => 'https://www.vidking.net/embed/tv/' + id + '/' + s + '/' + e + '?color=9146ff&autoPlay=true&nextEpisode=true&episodeSelector=true' },
            { name: 'VixSrc', movie: id => 'https://vixsrc.to/movie/' + id, tv: (id, s, e) => 'https://vixsrc.to/tv/' + id + '/' + s + '/' + e },
            { name: 'VidLink', movie: id => 'https://vidlink.pro/movie/' + id, tv: (id, s, e) => 'https://vidlink.pro/tv/' + id + '/' + s + '/' + e },
            { name: 'VidCore', movie: id => 'https://www.vidcore.org/embed/movie/' + id, tv: (id, s, e) => 'https://www.vidcore.org/embed/tv/' + id + '/' + s + '/' + e },
            { name: '1Embed', movie: id => 'https://1embed.cc/embed/movie/' + id, tv: (id, s, e) => 'https://1embed.cc/embed/tv/' + id + '/' + s + '/' + e },
            { name: 'VidLux', movie: id => 'https://vidlux.xyz/embed/movie/' + id, tv: (id, s, e) => 'https://vidlux.xyz/embed/tv/' + id + '/' + s + '/' + e }
        ];

        function nfxNote(msg) { nfxStatus.textContent = msg || ''; }

        function buildNfx() {
            if (!qTitle) { nfxServers.style.display = 'none'; return; }
            nfxServers.innerHTML = '';
            nfxNote('⏳ جارٍ البحث عن مصادر NyumatFlix...');
            fetch('/api/resolve?q=' + encodeURIComponent(qTitle) + '&type=' + qType)
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (!d || !d.tmdbId) {
                        nfxNote('لا توجد مصادر NyumatFlix لهذا العنوان' + ((d && d.error) ? ' (' + d.error + ')' : '') + '.');
                        return;
                    }
                    const isMovie = qType === 'movie';
                    const list = NFX_PROVIDERS.map(p => ({ name: p.name, url: isMovie ? p.movie(d.tmdbId) : p.tv(d.tmdbId, 1, qEp) }));
                    nfxNote('اختر مصدراً إضافياً:');
                    list.forEach((s, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'server-btn' + (i === 0 ? ' active' : '');
                        btn.textContent = 'NyumatFlix - ' + s.name;
                        btn.addEventListener('click', function () {
                            nfxServers.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            setFrame(s.url);
                        });
                        nfxServers.appendChild(btn);
                    });
                })
                .catch(function (e) { nfxNote('خطأ في جلب مصادر NyumatFlix: ' + e.message); });
        }
        buildNfx();

        // ---------- تخطي الإعلان ----------
        skipAd.addEventListener('click', function () {
            if (box.classList.contains('video-mode')) {
                // تدفق أصلي: القفز للأمام لتجاوز مقطع إعلاني
                if (video.duration && isFinite(video.duration) && video.duration > 0) {
                    video.currentTime = Math.min(video.duration - 2, video.currentTime + 30);
                } else {
                    video.currentTime += 30;
                }
                if (video.paused) video.play().catch(function () {});
                return;
            }
            // وضع iframe: الأفضلية للانتقال لأي سيرفر goVid (تشغيل أصلي بلا إعلانات)
            const govidServer = servers.find(function (s) { return s.url && s.url.indexOf('govid.live/play/') !== -1; });
            if (govidServer) {
                loadGovid(govidServer.url);
                return;
            }
            if (lastFrameUrl && lastFrameUrl.indexOf('govid.live/play/') !== -1) {
                loadGovid(lastFrameUrl);
                return;
            }
            // لا يوجد سيرفر أصلي: إعادة تحميل الإطار لمسح الإعلانات المنبثقة
            if (frame.src) {
                const cur = frame.src;
                frame.removeAttribute('src');
                setTimeout(function () { frame.src = cur; }, 80);
            }
        });
    </script>
</body>
</html>
